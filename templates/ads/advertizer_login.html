<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertizer Login | VibeBook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FF8C42;
            --primary-green: #4CAF50;
            --primary-gradient: linear-gradient(135deg, #FFC107 0%, #FF8C42 100%);
            --bg-cream: #FDFBF7;
            --text-dark: #111827;
            --text-light: #6B7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* --- Background Blobs --- */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        .blob-1 { top: -20%; left: -20%; width: 50vw; height: 50vw; background: #FFDAB9; }
        .blob-2 { bottom: -20%; right: -20%; width: 50vw; height: 50vw; background: #D4EDDA; }

        /* --- Login Card --- */
        .login-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-orange);
            text-decoration: none;
            margin-bottom: 8px;
        }
        .brand-logo span { color: var(--primary-green); }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .login-header p {
            color: var(--text-light);
            font-size: 13px;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
        }

        /* --- Alert --- */
        #alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        #alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        #alert.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: block; }

        /* --- Button --- */
        .btn-primary {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(255, 140, 66, 0.25);
            margin-top: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 140, 66, 0.4); }
        .btn-primary:disabled { background: #d1d5db; cursor: not-allowed; box-shadow: none; transform: none; }

        /* --- Loader --- */
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-orange);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="brand-logo">
            <i class="fa-solid fa-book-open"></i> Vibe<span>Book</span>
        </div>

        <div class="login-header">
            <h1>Advertizer Login</h1>
            <p>Enter your credentials to manage your ads</p>
        </div>

        <div id="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">Log In</span>
                <div class="loader" id="btnLoader"></div>
            </button>
        </form>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        // === CONFIGURATION ===
        // Change this to your actual backend URL (remove / at the end)
        const API_BASE_URL = 'https://vibebook-4.onrender.com';
        // const API_BASE_URL = 'http://127.0.0.1:8000';

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');

        function showAlert(message, type = 'error') {
            alertBox.className = type;
            alertBox.textContent = message;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.style.display = 'none';
                btnLoader.style.display = 'block';
            } else {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showAlert('', ''); // Clear previous alerts
            setLoading(true);

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showAlert('Please fill in both username and password.', 'error');
                setLoading(false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/advertizer/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('Login successful! Redirecting...', 'success');

                    // === SAVE ADVERTISER ID TO BROWSER STORAGE ===
                    localStorage.setItem('advertiser_id', data.advertiser_id);
                    localStorage.setItem('advertiser_company', data.company_name);
                    localStorage.setItem('advertiser_username', data.username);

                    // Redirect to the View Ads page after 1 second
                    setTimeout(() => {
                        window.location.href = '/view-ads/';
                    }, 1000);

                } else {
                    showAlert(data.error || 'Invalid username or password.', 'error');
                    setLoading(false);
                }

            } catch (error) {
                console.error('Login Error:', error);
                showAlert('Network error. Please check your server connection.', 'error');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
