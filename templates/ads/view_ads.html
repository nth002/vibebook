<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ads | VibeBook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF8C42;
            --primary-green: #4CAF50;
            --primary-gradient: linear-gradient(135deg, #FFC107 0%, #FF8C42 100%);
            --bg-cream: #FDFBF7;
            --text-dark: #111827;
            --text-light: #6B7280;
            --bg-gray: #F8FAFC;
            --border-light: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            font-size: 13px;
            line-height: 1.5;
        }

        /* --- Background Blobs --- */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.2;
            pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; width: 30vw; height: 30vw; background: #FFDAB9; }
        .blob-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: #D4EDDA; }

        /* --- Navbar --- */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-orange);
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .navbar-brand span { color: var(--primary-green); }

        .navbar-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar-menu a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 50px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .navbar-menu a:hover {
            background: rgba(255, 140, 66, 0.08);
            color: var(--primary-orange);
        }

        .navbar-menu a.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 140, 66, 0.25);
            border: none;
        }

        /* --- Layout --- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }
        .page-header h1 span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .page-header p {
            color: var(--text-light);
            font-size: 13px;
            margin-top: 2px;
        }

        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 140, 66, 0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 140, 66, 0.4); }

        .btn-success {
            background: var(--primary-green);
            color: white;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.2);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3); }

        .btn-secondary {
            background: var(--bg-gray);
            color: var(--text-dark);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover { background: #f1f5f9; }

        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* --- Alerts --- */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        .alert-info { background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; display: block; }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }

        .stat-card .label { color: var(--text-light); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: var(--text-dark); margin-top: 4px; }
        .stat-card .value.active { color: var(--primary-green); }
        .stat-card .value.views { color: #3B82F6; }
        .stat-card .value.clicks { color: #f59e0b; }
        .stat-card .value.ctr { color: #8b5cf6; }

        /* --- Filters --- */
        .filters {
            background: white;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid var(--border-light);
        }

        .filters input, .filters select {
            padding: 8px 12px;
            background: var(--bg-gray);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 13px;
            flex: 1;
            min-width: 150px;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        .filters input:focus, .filters select:focus {
            outline: none;
            border-color: var(--primary-orange);
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.08);
        }

        /* --- Ads Grid --- */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .ad-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ad-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
            border-color: rgba(255, 140, 66, 0.2);
        }

        .ad-image-container {
            position: relative;
            overflow: hidden;
            background: var(--bg-gray);
            height: 160px;
        }
        .ad-image {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ad-card:hover .ad-image { transform: scale(1.04); }

        .ad-status-badge {
            position: absolute;
            top: 10px; right: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .status-active { background: #d4edda; color: #155724; }
        .status-inactive { background: #f8d7da; color: #721c24; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-expired { background: #e2e3e5; color: #383d41; }

        .ad-body { padding: 16px 18px 18px 18px; }

        .ad-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; letter-spacing: -0.3px; }
        .ad-brand { color: var(--primary-orange); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
        .ad-description { color: var(--text-light); font-size: 13px; margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .ad-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .ad-meta-item { background: var(--bg-gray); padding: 3px 10px; border-radius: 20px; font-size: 11px; color: var(--text-light); border: 1px solid var(--border-light); }

        .ad-dates {
            font-size: 12px; color: var(--text-light); margin-bottom: 12px;
            display: flex; justify-content: space-between; padding: 10px 0;
            border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
        }
        .ad-dates span { display: flex; align-items: center; gap: 4px; }

        .ad-stats-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 0;
        }
        .ad-stat-item { text-align: center; padding: 6px; background: var(--bg-gray); border-radius: 8px; }
        .ad-stat-item .number { font-size: 15px; font-weight: 700; color: var(--text-dark); }
        .ad-stat-item .label { font-size: 10px; color: var(--text-light); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

        .ad-actions {
            display: flex; gap: 8px; padding: 12px 18px;
            border-top: 1px solid var(--border-light); background: #FAFBFC;
        }
        .ad-actions .btn { flex: 1; text-align: center; font-size: 12px; padding: 8px 10px; }
        .ad-actions .btn-danger { flex: 0.5; }

        /* --- States --- */
        .loading { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .spinner { border: 3px solid var(--bg-gray); border-top: 3px solid var(--primary-orange); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { color: var(--text-dark); font-size: 16px; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; }

        /* --- Modal --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 24, 39, 0.5); backdrop-filter: blur(4px);
            z-index: 2000; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal.active { display: flex; }

        .modal-content {
            background: white; padding: 32px; border-radius: 20px; max-width: 700px; width: 95%; max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-light); }
        .modal-header h2 { color: var(--text-dark); font-size: 20px; letter-spacing: -0.3px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); transition: all 0.3s; padding: 0 5px; }
        .modal-close:hover { color: var(--text-dark); transform: rotate(90deg); }

        .modal-body { margin: 16px 0; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
        .detail-row .label { color: var(--text-light); font-weight: 500; }
        .detail-row .value { color: var(--text-dark); font-weight: 500; }

        /* --- Logout Button --- */
        .btn-logout {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .btn-logout:hover { background: #dc2626; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .navbar-menu { flex-wrap: wrap; justify-content: center; width: 100%; }
            .page-header { flex-direction: column; text-align: center; }
            .ads-grid { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
            .filters input, .filters select { width: 100%; min-width: unset; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .modal-content { padding: 20px; }
            .modal-body .detail-row { grid-column: span 1 !important; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .ad-actions { flex-wrap: wrap; }
            .ad-actions .btn { flex: 1 1 100%; }
            .ad-stats-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <i class="fa-solid fa-book-open"></i> Vibe<span>Book</span>
        </a>
        <div class="navbar-menu">
            <a href="/create_ad_page/">📝 Create Ad</a>
            <a href="/view-ads/" class="active">👁️ My Ads</a>
            <button class="btn-logout" onclick="logoutAdvertizer()">🚪 Logout</button>
        </div>
        <i class="fa-solid fa-bars" style="font-size: 18px; color: var(--text-dark); display: none; cursor: pointer;"></i>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>📈 <span id="companyNameDisplay">My</span> <span>Campaigns</span></h1>
                <p>View and manage all your ad campaigns</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="loadMyAds()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                <a href="/create_ad_page/" class="btn btn-success"><i class="fa-solid fa-plus"></i> New Ad</a>
            </div>
        </div>

        <div id="alert" class="alert"></div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Ads</div>
                <div class="value" id="totalAds">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Ads</div>
                <div class="value active" id="activeAds">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Views</div>
                <div class="value views" id="totalViews">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Clicks</div>
                <div class="value clicks" id="totalClicks">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg. CTR</div>
                <div class="value ctr" id="avgCtr">0%</div>
            </div>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Search ads by title or brand..." onkeyup="filterAds()">
            <select id="statusFilter" onchange="filterAds()">
                <option value="all">All Status</option>
                <option value="ACTIVE">Active</option>
                <option value="PENDING">Pending</option>
                <option value="EXPIRED">Expired</option>
                <option value="INACTIVE">Inactive</option>
            </select>
            <select id="typeFilter" onchange="filterAds()">
                <option value="all">All Types</option>
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="carousel">Carousel</option>
            </select>
            <select id="sortFilter" onchange="filterAds()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="views">Most Views</option>
                <option value="clicks">Most Clicks</option>
                <option value="ctr">Highest CTR</option>
            </select>
        </div>

        <div id="adsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your advertisements...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="adModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ad Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <button class="btn btn-primary" onclick="closeModal()" style="width:100%;">Close Details</button>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const API_BASE_URL = 'https://vibebook-4.onrender.com';
        // const API_BASE_URL = 'http://127.0.0.1:8000';

        let allAds = [];
        let filteredAds = [];
        let currentAdvertiserId = null;

        // ==========================================
        // CHECK LOGIN & LOAD ADS
        // ==========================================
        function checkLoginAndLoad() {
            // 1. Get the advertiser_id saved in localStorage by the Login page
            const advertiserId = localStorage.getItem('advertiser_id');
            const companyName = localStorage.getItem('advertiser_company');

            if (!advertiserId) {
                // If not logged in, redirect back to login page
                window.location.href = '/advertizer/login-page/';
                return;
            }

            // 2. Set the global variable
            currentAdvertiserId = advertiserId;

            // 3. Display the company name
            if (companyName) {
                document.getElementById('companyNameDisplay').textContent = companyName;
            }

            // 4. Load the ads
            loadMyAds();
        }

        // ==========================================
        // LOGOUT FUNCTION
        // ==========================================
        function logoutAdvertizer() {
            localStorage.removeItem('advertiser_id');
            localStorage.removeItem('advertiser_company');
            localStorage.removeItem('advertiser_username');
            window.location.href = '/advertizer/login-page/';
        }

        // ==========================================
        // SHOW ALERT
        // ==========================================
        function showAlert(message, type = 'info', duration = 5000) {
            const alertDiv = document.getElementById('alert');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            if (duration > 0) setTimeout(() => { alertDiv.style.display = 'none'; }, duration);
        }

        function hideAlert() { document.getElementById('alert').style.display = 'none'; }

        // ==========================================
        // FETCH ADS (Filtered by Advertiser ID)
        // ==========================================
        async function loadMyAds() {
            const container = document.getElementById('adsContainer');
            container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Loading your ads...</p></div>`;

            if (!currentAdvertiserId) {
                showAlert('Advertiser ID missing. Please log in again.', 'error');
                return;
            }

            try {
                // ✅ FIX: Append ?advertiser_id= to the URL
                const response = await fetch(`${API_BASE_URL}/api/public/ads/?advertiser_id=${currentAdvertiserId}`, {
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to load ads');
                }

                const data = await response.json();
                allAds = data.data || data.results || [];

                await loadAdStats();

                updateStats();
                filteredAds = [...allAds];
                renderAds();

            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <h3>Failed to load ads</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadMyAds()" style="margin-top:15px;">Try Again</button>
                    </div>
                `;
                showAlert('Error loading ads: ' + error.message, 'error');
            }
        }

        // ==========================================
        // FETCH INDIVIDUAL STATS
        // ==========================================
        async function loadAdStats() {
            for (let ad of allAds) {
                try {
                    // ✅ FIX: Append ?advertiser_id= to the stats URL
                    const response = await fetch(`${API_BASE_URL}/api/public/ads/${ad.id}/stats/?advertiser_id=${currentAdvertiserId}`, {
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        const stats = await response.json();
                        ad.views = stats.data.views || 0;
                        ad.clicks = stats.data.clicks || 0;
                        ad.ctr = stats.data.ctr || 0;
                    } else {
                        ad.views = 0; ad.clicks = 0; ad.ctr = 0;
                    }
                } catch {
                    ad.views = 0; ad.clicks = 0; ad.ctr = 0;
                }
            }
        }

        // ==========================================
        // UPDATE STATS CARDS
        // ==========================================
        function updateStats() {
            const total = allAds.length;
            const active = allAds.filter(ad => ad.status === 'ACTIVE' && ad.is_active).length;
            const totalViews = allAds.reduce((sum, ad) => sum + (ad.views || 0), 0);
            const totalClicks = allAds.reduce((sum, ad) => sum + (ad.clicks || 0), 0);
            const avgCtr = totalViews > 0 ? ((totalClicks / totalViews) * 100) : 0;

            document.getElementById('totalAds').textContent = total;
            document.getElementById('activeAds').textContent = active;
            document.getElementById('totalViews').textContent = totalViews.toLocaleString();
            document.getElementById('totalClicks').textContent = totalClicks.toLocaleString();
            document.getElementById('avgCtr').textContent = avgCtr.toFixed(1) + '%';
        }

        // ==========================================
        // FILTER ADS
        // ==========================================
        function filterAds() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const sortFilter = document.getElementById('sortFilter').value;

            filteredAds = allAds.filter(ad => {
                const matchesSearch = ad.title.toLowerCase().includes(searchTerm) || ad.brand_name.toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === 'all' || ad.status === statusFilter;
                const matchesType = typeFilter === 'all' || ad.ad_type === typeFilter;
                return matchesSearch && matchesStatus && matchesType;
            });

            switch (sortFilter) {
                case 'newest': filteredAds.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); break;
                case 'oldest': filteredAds.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); break;
                case 'views': filteredAds.sort((a, b) => (b.views || 0) - (a.views || 0)); break;
                case 'clicks': filteredAds.sort((a, b) => (b.clicks || 0) - (a.clicks || 0)); break;
                case 'ctr': filteredAds.sort((a, b) => (b.ctr || 0) - (a.ctr || 0)); break;
                default: break;
            }

            renderAds();
        }

        // ==========================================
        // RENDER ADS
        // ==========================================
        function renderAds() {
            const container = document.getElementById('adsContainer');

            if (filteredAds.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>No Ads Found</h3>
                        <p>${allAds.length === 0 ? 'No ads have been created yet.' : 'No ads match your filters.'}</p>
                        <a href="/create_ad_page/" class="btn btn-success" style="margin-top:15px;">Create Your First Ad</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="ads-grid">${filteredAds.map(ad => createAdCard(ad)).join('')}</div>`;
        }

        // ==========================================
        // CREATE AD CARD HTML
        // ==========================================
        function createAdCard(ad) {
            const statusClass = `status-${(ad.status || 'inactive').toLowerCase()}`;
            const statusText = ad.status || 'Inactive';
            const startDate = ad.start_date ? new Date(ad.start_date).toLocaleDateString() : 'N/A';
            const endDate = ad.end_date ? new Date(ad.end_date).toLocaleDateString() : 'N/A';
            const views = ad.views || 0; const clicks = ad.clicks || 0; const ctr = ad.ctr || 0;
            const isActive = ad.status === 'ACTIVE' && ad.is_active;

            return `
                <div class="ad-card" data-id="${ad.id}">
                    <div class="ad-image-container">
                        <img src="${ad.image_url || 'https://via.placeholder.com/400x200?text=No+Image'}" 
                             alt="${ad.title}" class="ad-image"
                             onerror="this.src='https://via.placeholder.com/400x200?text=Image+Not+Found'">
                        <span class="ad-status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="ad-body">
                        <div class="ad-title">${ad.title}</div>
                        <div class="ad-brand">${ad.brand_name}</div>
                        <div class="ad-description">${ad.description || 'No description provided'}</div>
                        <div class="ad-meta">
                            <span class="ad-meta-item">${ad.ad_type || 'image'}</span>
                            <span class="ad-meta-item">${ad.target_gender || 'all'}</span>
                            ${ad.target_age_min ? `<span class="ad-meta-item">${ad.target_age_min}-${ad.target_age_max || '+'} yrs</span>` : ''}
                            ${ad.target_location ? `<span class="ad-meta-item">📍 ${ad.target_location}</span>` : ''}
                            ${ad.budget ? `<span class="ad-meta-item">💰 $${ad.budget}</span>` : ''}
                        </div>
                        <div class="ad-dates">
                            <span>📅 ${startDate}</span>
                            <span>→</span>
                            <span>${endDate}</span>
                        </div>
                        <div class="ad-stats-bar">
                            <div class="ad-stat-item">
                                <div class="number">${views.toLocaleString()}</div>
                                <div class="label">👁️ Views</div>
                            </div>
                            <div class="ad-stat-item">
                                <div class="number">${clicks.toLocaleString()}</div>
                                <div class="label">🖱️ Clicks</div>
                            </div>
                            <div class="ad-stat-item">
                                <div class="number">${ctr.toFixed(1)}%</div>
                                <div class="label">📊 CTR</div>
                            </div>
                        </div>
                    </div>
                    <div class="ad-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewAdDetails('${ad.id}')">📄 Details</button>
                        ${isActive ? `<button class="btn btn-success btn-sm" onclick="trackAdClick('${ad.id}')">🔗 Track Click</button>` : ''}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // VIEW AD DETAILS (WITH ADVERTISER ID)
        // ==========================================
        async function viewAdDetails(adId) {
            const modal = document.getElementById('adModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = 'Loading...';
            modalBody.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_BASE_URL}/api/public/ads/${adId}/?advertiser_id=${currentAdvertiserId}`, {
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error('Failed to load ad details');
                const result = await response.json();
                const ad = result.data;

                const statsResponse = await fetch(`${API_BASE_URL}/api/public/ads/${adId}/stats/?advertiser_id=${currentAdvertiserId}`, {
                    headers: { 'Content-Type': 'application/json' }
                });
                let stats = { data: { views: 0, clicks: 0, ctr: 0 } };
                if (statsResponse.ok) stats = await statsResponse.json();

                modalTitle.textContent = ad.title;

                modalBody.innerHTML = `
                    <div style="margin-bottom:16px;">
                        <img src="${ad.image_url || 'https://via.placeholder.com/600x300?text=No+Image'}" 
                             style="width:100%;border-radius:10px;max-height:250px;object-fit:cover;"
                             onerror="this.src='https://via.placeholder.com/600x300?text=Image+Not+Found'">
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                        <div class="detail-row" style="grid-column:span 2;">
                            <span class="label">Title</span>
                            <span class="value">${ad.title}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Brand</span>
                            <span class="value">${ad.brand_name}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Status</span>
                            <span class="value"><span class="ad-status-badge status-${(ad.status || 'inactive').toLowerCase()}" style="position:static;">${ad.status || 'Inactive'}</span></span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Type</span>
                            <span class="value">${ad.ad_type}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Target</span>
                            <span class="value">${ad.target_gender}${ad.target_age_min ? ` (${ad.target_age_min}-${ad.target_age_max || '+'} yrs)` : ''}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Location</span>
                            <span class="value">${ad.target_location || 'All'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Start Date</span>
                            <span class="value">${new Date(ad.start_date).toLocaleString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">End Date</span>
                            <span class="value">${new Date(ad.end_date).toLocaleString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Created</span>
                            <span class="value">${new Date(ad.created_at).toLocaleString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Budget</span>
                            <span class="value">$${ad.budget || '0.00'}</span>
                        </div>
                        ${ad.cta_url ? `
                            <div class="detail-row" style="grid-column:span 2;">
                                <span class="label">CTA URL</span>
                                <span class="value"><a href="${ad.cta_url}" target="_blank" style="color:var(--primary-orange);font-weight:600;">${ad.cta_text || 'Learn More'}</a></span>
                            </div>
                        ` : ''}
                    </div>

                    ${ad.description ? `
                        <div style="margin-top:16px;padding:14px;background:var(--bg-gray);border-radius:10px;border:1px solid var(--border-light);">
                            <strong style="font-size:12px;">Description:</strong>
                            <p style="margin-top:4px;color:var(--text-light);font-size:13px;">${ad.description}</p>
                        </div>
                    ` : ''}

                    <div style="margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;background:var(--bg-gray);border-radius:12px;border:1px solid var(--border-light);">
                        <div style="text-align:center;">
                            <div style="font-size:20px;font-weight:700;color:#3B82F6;">${(stats.data.views || 0).toLocaleString()}</div>
                            <div style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">👁️ Views</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-size:20px;font-weight:700;color:#f59e0b;">${(stats.data.clicks || 0).toLocaleString()}</div>
                            <div style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">🖱️ Clicks</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-size:20px;font-weight:700;color:#8b5cf6;">${(stats.data.ctr || 0).toFixed(1)}%</div>
                            <div style="color:var(--text-light);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">📊 CTR</div>
                        </div>
                    </div>
                `;

            } catch (error) {
                modalBody.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <h3>Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function closeModal() { document.getElementById('adModal').classList.remove('active'); }
        document.getElementById('adModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        // ==========================================
        // TRACK CLICK
        // ==========================================
        async function trackAdClick(adId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/public/ads/${adId}/click/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error('Failed to track click');
                const data = await response.json();
                showAlert('✅ Click tracked successfully!', 'success');
                if (data.redirect_url) window.open(data.redirect_url, '_blank');
                loadMyAds();
            } catch (error) {
                showAlert('❌ Error tracking click: ' + error.message, 'error');
            }
        }

        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        // ==========================================
        // INITIALIZE
        // ==========================================
        checkLoginAndLoad();
    </script>
</body>
</html>
